name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --stacktrace --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk EepromPocket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EepromPocket-apk
          path: EepromPocket.apk
